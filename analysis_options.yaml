include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**

linter:
  rules:
    # Purely stylistic "add const" hints are switched off on purpose: they add noise without changing behaviour.
    # Every correctness-related lint from flutter_lints stays on (use_build_context_synchronously, etc.).
    prefer_const_constructors: false
    prefer_const_constructors_in_immutables: false
    prefer_const_declarations: false
    prefer_const_literals_to_create_immutables: false
